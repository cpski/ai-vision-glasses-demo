<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Vision Glasses Demo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0 auto;
        padding: 24px;
        max-width: 760px;
        background: radial-gradient(circle at 10% 20%, #111827 0, #0b0f1d 60%);
        color: #f9fafb;
      }
      h1 {
        margin-top: 0;
        font-size: 1.9rem;
      }
      .card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 16px 18px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input[type="file"],
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
      }
      input[type="file"] {
        padding: 10px 0;
      }
      textarea {
        resize: vertical;
        min-height: 80px;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font-size: 1rem;
      }
      button {
        margin-top: 12px;
        padding: 12px 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(120deg, #60a5fa, #a78bfa);
        color: #0b0f1d;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.2s ease;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }
      .row {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .pill {
        display: inline-block;
        background: rgba(255, 255, 255, 0.08);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.9rem;
      }
      #preview {
        max-width: 100%;
        border-radius: 12px;
        margin-top: 10px;
        display: none;
      }
      #status {
        font-size: 0.95rem;
        color: #cbd5e1;
      }
      #answer {
        white-space: pre-line;
      }
      a {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <h1>AI Vision Glasses Demo</h1>
    <p>
      This page mirrors the <strong>glasses → phone → server → vision AI → spoken answer</strong>
      loop. Upload a photo (or capture directly on mobile), send it to the backend, and hear
      the response.
    </p>

    <div class="card">
      <div class="row">
        <div>
          <label for="image">Capture or upload a question photo</label>
          <input id="image" type="file" accept="image/*" capture="environment" />
          <img id="preview" alt="Preview" />
        </div>
        <div>
          <label for="prompt">Prompt sent to the vision model</label>
          <textarea id="prompt" rows="4">
Identify the question in this photo and answer it clearly in one or two sentences. Provide a short explanation that could be spoken to a teacher during a demo.
          </textarea>
        </div>
      </div>
      <button id="ask" type="button">Ask AI</button>
      <div id="status" aria-live="polite"></div>
    </div>

    <div class="card">
      <h3>Answer</h3>
      <div class="pill" id="model-pill">Model: —</div>
      <p id="answer">Upload a photo to get started.</p>
      <button id="speak" type="button" disabled>🔈 Read aloud</button>
    </div>

    <script>
      const imageInput = document.getElementById("image");
      const promptInput = document.getElementById("prompt");
      const askButton = document.getElementById("ask");
      const speakButton = document.getElementById("speak");
      const answerEl = document.getElementById("answer");
      const statusEl = document.getElementById("status");
      const modelPill = document.getElementById("model-pill");
      const preview = document.getElementById("preview");

      let lastAnswer = "";

      imageInput.addEventListener("change", () => {
        const file = imageInput.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          preview.src = e.target?.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      });

      speakButton.addEventListener("click", () => {
        if (!lastAnswer) return;
        const utterance = new SpeechSynthesisUtterance(lastAnswer);
        utterance.rate = 1;
        utterance.pitch = 1;
        speechSynthesis.speak(utterance);
      });

      askButton.addEventListener("click", async () => {
        const file = imageInput.files?.[0];
        if (!file) {
          alert("Please select or capture an image first.");
          return;
        }

        const formData = new FormData();
        formData.append("image", file);
        formData.append("prompt", promptInput.value.trim());

        askButton.disabled = true;
        statusEl.textContent = "Sending to /api/solve ...";
        answerEl.textContent = "Working...";

        try {
          const response = await fetch("/api/solve", {
            method: "POST",
            body: formData,
          });
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || `Request failed with ${response.status}`);
          }
          const result = await response.json();
          lastAnswer = result.answer;
          answerEl.textContent = `${result.answer}\n\n${result.explanation}`;
          modelPill.textContent = `Model: ${result.model}${result.used_fallback ? " (fallback)" : ""}`;
          statusEl.textContent = "Done.";
          speakButton.disabled = false;
        } catch (err) {
          console.error(err);
          statusEl.textContent = `Error: ${err.message}`;
          answerEl.textContent = "";
          speakButton.disabled = true;
        } finally {
          askButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
